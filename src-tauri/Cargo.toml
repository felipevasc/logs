[package]
name = "loginsight"
version = "0.3.2"
description = "Visualizador e analisador de logs"
edition = "2021"
rust-version = "1.88"

[lib]
name = "loginsight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
roxmltree = "0.20"
parking_lot = "0.12"
memmap2 = "0.9"
memchr = "2"
rayon = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
rmcp = { version = "3.1", features = ["transport-streamable-http-server"] }
schemars = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["net", "rt", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
base64 = "0.22.1"
tempfile = "3.27"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_EventLog",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[package]
name = "loginsight"
version = "0.1.0"
description = "Visualizador e analisador de logs"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "loginsight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
roxmltree = "0.20"
parking_lot = "0.12"
memmap2 = "0.9"
memchr = "2"
rayon = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_EventLog",
    "Win32_Foundation",
    "Win32_Security",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

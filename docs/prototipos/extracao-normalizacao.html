<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extração e normalização — protótipo</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1c2230; --muted: #8a93a6; --line: #e6e9ef; --soft: #f0f2f6;
  --accent: #e07a1f; --accent-soft: #fdf0e3; --ok: #2b9a57; --bad: #d23f3f; --bad-soft: #fdeaea; --warn: #c98a1b;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace; --shadow: 0 10px 30px rgba(20, 28, 45, .16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #12151c; --panel: #1a1f29; --ink: #e8ebf2; --muted: #7f8aa0; --line: #2a3140; --soft: #232a37; --accent: #f29a4b; --accent-soft: #35261a; --ok: #54c27e; --bad: #ff8585; --bad-soft: #3a2224; --warn: #e3b25a; --shadow: 0 10px 30px rgba(0, 0, 0, .5); }
}
:root[data-theme="dark"] { --bg: #12151c; --panel: #1a1f29; --ink: #e8ebf2; --muted: #7f8aa0; --line: #2a3140; --soft: #232a37; --accent: #f29a4b; --accent-soft: #35261a; --ok: #54c27e; --bad: #ff8585; --bad-soft: #3a2224; --warn: #e3b25a; --shadow: 0 10px 30px rgba(0, 0, 0, .5); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ib { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--muted); }
.ib:hover, .ib:focus-visible { background: var(--soft); color: var(--ink); outline: none; }
.i { display: inline-grid; place-items: center; width: 18px; height: 18px; border: 0; background: none; color: var(--muted); border-radius: 50%; padding: 0; opacity: .7; vertical-align: middle; }
.i:hover, .i:focus-visible { opacity: 1; color: var(--accent); outline: none; }
.i svg { width: 14px; height: 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 6px 12px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.tag { position: fixed; right: 10px; bottom: 8px; font-size: 10px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; opacity: .7; pointer-events: none; }
header.top { display: flex; align-items: center; gap: 6px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
header.top h1 { font-size: 15px; margin: 0 10px 0 0; font-weight: 650; }
.pill { font-size: 12px; color: var(--muted); background: var(--soft); padding: 3px 10px; border-radius: 999px; }
.grow { flex: 1; }
.wrap { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 18px; padding: 18px; align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: minmax(0, 1fr); } .types { display: flex; gap: 8px; overflow-x: auto; } .types .group { min-width: 160px; margin: 0; } }
.sec { display: flex; align-items: center; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px 2px; }
.group { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid transparent; border-radius: 12px; padding: 9px 10px; margin-bottom: 4px; background: none; }
.group:hover { background: var(--soft); }
.group[aria-pressed="true"] { background: var(--panel); border-color: var(--line); box-shadow: 0 1px 3px rgba(20, 28, 45, .08); }
.group b { flex: 1; font-weight: 600; font-size: 13px; }
.ring { --p: 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; font-weight: 700; background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--line) 0); position: relative; flex: none; }
.ring::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--panel); }
.ring span { position: relative; }
.ring.low { background: conic-gradient(var(--warn) calc(var(--p) * 1%), var(--line) 0); }
.addrow { display: flex; gap: 4px; margin-top: 6px; }
.addrow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 9px; font: 12px var(--mono); }
.stage { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
.suggest { display: flex; align-items: center; gap: 8px; background: var(--accent-soft); border-radius: 12px; padding: 7px 8px 7px 14px; margin-bottom: 12px; font-weight: 550; }
.suggest span { flex: 1; }
.lvhead { display: flex; align-items: center; gap: 2px; margin-bottom: 8px; }
.lvhead .sec { margin: 0; flex: 1; }
.lvhead small { color: var(--muted); font-size: 12px; margin: 0 4px; }
.lineview { font: 15px/2.2 var(--mono); padding: 10px 14px; border-radius: 10px; background: var(--soft); overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; cursor: text; outline: none; }
.lineview:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.chip { border-radius: 6px; padding: 1px 3px; box-shadow: inset 0 -2px 0 var(--line); cursor: pointer; transition: background .12s; }
.chip:hover, .chip.focus { background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
.chip.col { box-shadow: inset 0 -2px 0 var(--c); background: color-mix(in srgb, var(--c) 20%, transparent); }
.chip.col::after { content: attr(data-name); font: 700 10px system-ui; margin-left: 5px; color: var(--c); filter: brightness(.82); user-select: none; vertical-align: middle; }
.chip.ignored { text-decoration: line-through; opacity: .5; }
.chip.origin { outline: 3px solid var(--accent); }
.cov { display: flex; align-items: center; gap: 10px; margin: 12px 2px 14px; }
.cov .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.cov .bar i { display: block; height: 100%; background: var(--ok); transition: width .25s; }
.cov .bar.low i { background: var(--warn); }
.cov strong { font-size: 13px; min-width: 42px; text-align: right; }
.cov .left { display: inline-flex; align-items: center; gap: 4px; border: 0; background: var(--bad-soft); color: var(--bad); border-radius: 999px; padding: 2px 10px 2px 8px; font-weight: 650; font-size: 12px; }
.cov .left svg { width: 13px; height: 13px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 12px; text-align: left; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; font-weight: 650; cursor: context-menu; user-select: none; background: var(--panel); }
th .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: var(--c); }
th .ty { color: var(--muted); font-weight: 500; font-size: 11px; margin-left: 6px; }
th:hover { background: var(--soft); }
td.bad { background: var(--bad-soft); color: var(--bad); cursor: help; }
td.bad::before { content: "⚠ "; }
td.miss { color: var(--muted); }
td.num { font-family: var(--mono); }
tr.current td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
tr:last-child td { border-bottom: 0; }
.empty { display: grid; place-items: center; gap: 8px; padding: 26px; color: var(--muted); }
.empty svg { width: 22px; height: 22px; }
.menu { position: fixed; z-index: 50; min-width: 250px; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 5px; }
.menu .title { font-size: 11px; color: var(--muted); padding: 5px 10px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu button { display: flex; width: 100%; gap: 10px; align-items: center; border: 0; background: none; border-radius: 8px; padding: 7px 10px; text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--accent-soft); outline: none; }
.menu button.first { font-weight: 650; }
.menu button svg { color: var(--muted); }
.menu button kbd { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.pop { position: fixed; z-index: 55; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; box-shadow: var(--shadow); width: min(560px, calc(100vw - 24px)); max-height: 60vh; overflow: auto; }
.pop ul { list-style: none; margin: 0; padding: 0; }
.pop li { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; font: 12px var(--mono); cursor: context-menu; }
.pop li:hover { background: var(--soft); }
.pop li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; z-index: 70; font-size: 13px; max-width: 90vw; }
dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); color: var(--ink); width: min(460px, calc(100vw - 24px)); padding: 20px 22px; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 14, 24, .45); }
dialog h2 { font-size: 16px; margin: 0 0 10px; }
dialog p { margin: 0 0 10px; color: var(--muted); }
dialog ul { margin: 0 0 12px; padding-left: 18px; }
dialog li { margin: 3px 0; }
dialog kbd { font: 12px var(--mono); background: var(--soft); border-radius: 5px; padding: 1px 6px; }
dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
dialog code { font: 12px var(--mono); background: var(--soft); padding: 1px 6px; border-radius: 5px; }
pre.json { background: var(--soft); border-radius: 12px; padding: 14px; overflow: auto; font: 12px/1.5 var(--mono); margin: 0; max-height: 70vh; }
@media (max-width: 560px) { #src { display: none; } header.top { padding: 8px 10px; } .wrap { padding: 10px; } .stage, .types { min-width: 0; } .btn.primary { padding: 6px 10px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <h1>Extração</h1>
  <span class="pill" id="src"></span>
  <span class="grow"></span>
  <button class="ib" id="undo" type="button" title="Desfazer" aria-label="Desfazer"></button>
  <button class="ib" data-info="geral" type="button" title="Como usar" aria-label="Como usar"></button>
  <button class="ib" data-tab="adv" type="button" title="Avançado" aria-label="Avançado"></button>
  <button class="ib" id="theme" type="button" title="Tema" aria-label="Alternar tema"></button>
  <button class="btn primary" id="apply" type="button"></button>
</header>

<div class="wrap" id="easy">
  <aside class="types" aria-label="Tipos de linha">
    <div class="sec">Tipos <button class="i" data-info="tipos" type="button" aria-label="Mais informações"></button></div>
    <div id="groups"></div>
    <div class="addrow"><input id="paste" placeholder="Colar linha…" aria-label="Colar uma linha"><button class="ib" id="paste-add" type="button" aria-label="Adicionar linha"></button></div>
  </aside>
  <section class="stage">
    <div id="suggest"></div>
    <div class="card">
      <div class="lvhead">
        <div class="sec" id="line-title">Linha <button class="i" data-info="linha" type="button" aria-label="Mais informações"></button></div>
        <button class="ib" id="prev" type="button" aria-label="Linha anterior"></button><small id="pos"></small><button class="ib" id="next" type="button" aria-label="Próxima linha"></button>
      </div>
      <div class="lineview" id="line" tabindex="0" role="textbox" aria-readonly="true" aria-label="Linha de exemplo"></div>
    </div>
    <div class="cov"><span class="sec" style="margin:0">Cobertura <button class="i" data-info="cobertura" type="button" aria-label="Mais informações"></button></span><div class="bar" id="cov-bar"><i></i></div><strong id="cov-text"></strong><button class="left" id="unrec-btn" type="button" hidden></button></div>
    <div class="card" style="padding:6px 8px">
      <div class="tablewrap"><table id="table"></table></div>
    </div>
  </section>
</div>

<div class="wrap" id="adv" hidden style="grid-template-columns:minmax(0,1fr)">
  <section class="card">
    <div class="lvhead"><div class="sec">Definição <button class="i" data-info="avancado" type="button" aria-label="Mais informações"></button></div><button class="ib" data-tab="easy" type="button" aria-label="Voltar"></button></div>
    <pre class="json" id="json"></pre>
  </section>
</div>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<span class="tag">protótipo · dados simulados</span>
<dialog id="info"><h2 id="info-title"></h2><div id="info-body"></div><div class="row"><form method="dialog"><button class="btn">Fechar</button></form></div></dialog>
<dialog id="dlg">
  <h2>Aplicar ao Caso</h2>
  <div id="dlg-body"></div>
  <form method="dialog" class="row"><button class="btn" value="no">Voltar</button><button class="btn primary" value="ok">Aplicar</button></form>
</dialog>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ICON = {
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>', check: '<path d="M5 12l5 5 9-10"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  moon: '<path d="M20 14a8 8 0 1 1-9-10 6 6 0 0 0 9 10z"/>', code: '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  warn: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>', left: '<path d="M15 6l-6 6 6 6"/>', right: '<path d="M9 6l6 6-6 6"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>', col: '<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M10 5v14M4 11h16"/>',
  hide: '<path d="M3 3l18 18M10 6.2A9 9 0 0 1 21 12a13 13 0 0 1-3 3.8M6.3 7.5A13 13 0 0 0 3 12s3.5 6 9 6a9 9 0 0 0 3-.5"/>', lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>', edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', copy: '<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  filter: '<path d="M4 5h16l-6 8v6l-4-2v-4z"/>', zap: '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>', trash: '<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>', eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  type: '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>', clean: '<path d="M5 19l9-9M14 5l5 5M13 6l-4-2 1 4"/>', list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>', dup: '<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>', opt: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.7M12 17h.01"/>',
};
const svg = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
function paintIcons() {
  const map = { "#undo": "undo", "[data-info=geral]": "info", "[data-tab=adv]": "code", "#theme": "moon", "#prev": "left", "#next": "right", "#paste-add": "plus", "[data-tab=easy]": "left" };
  for (const [s, n] of Object.entries(map)) document.querySelectorAll(s).forEach(b => b.innerHTML = svg(n));
  document.querySelectorAll(".i").forEach(b => b.innerHTML = svg("info"));
  $("#apply").innerHTML = svg("check") + "Aplicar";
}
const INFO = {
  geral: ["Como usar", `<p>Ensine o app pelo exemplo: marque pedaços da linha e veja a tabela se montar.</p><ul><li>Clique numa <b>etiqueta</b> para virar coluna.</li><li>Selecione qualquer trecho e use o <b>botão direito</b>.</li><li>Botão direito no <b>cabeçalho</b> ou numa <b>célula</b> para mais ações.</li></ul><p>Atalhos na linha: <kbd>Tab</kbd> percorre, <kbd>C</kbd> coluna, <kbd>I</kbd> ignora, <kbd>Delete</kbd> remove, <kbd>Ctrl</kbd>+<kbd>Z</kbd> desfaz.</p>`],
  tipos: ["Tipos de linha", `<p>O aplicativo agrupa as linhas do arquivo por aparência. Cada tipo tem suas próprias colunas.</p><p>O anel mostra quanto do tipo já é reconhecido.</p>`],
  linha: ["Linha de exemplo", `<p>Etiquetas pontilhadas são pedaços que o app reconheceu (IP, data, valores). Passe o mouse para ver o que são.</p><p>Selecione um trecho que não esteja marcado e use o botão direito para criar a coluna.</p>`],
  cobertura: ["Cobertura", `<p>Quantas linhas do arquivo o que você ensinou já reconhece. O que sobrar aparece no aviso vermelho: use o botão direito numa linha para ensiná-la.</p>`],
  avancado: ["Definição", `<p>A mesma definição que a tela monta, em texto. Aqui ficam também Grok, regras com prioridade, políticas de valor ausente e índices.</p>`],
};
const POP = 120000;
// ---------- dados simulados (o aplicativo usa o motor nativo) ----------
const FILE = "access.log + app.log";
const LINES = [
  { g: "http", t: '10.0.0.5 - ana [23/Oct/2026:17:05:09 +0000] "GET /index.html HTTP/1.1" 200 5120 "-" "curl/8.4"' },
  { g: "http", t: '192.168.1.20 - - [23/Oct/2026:17:05:11 -0300] "POST /api/login HTTP/1.1" 401 87 "-" "Mozilla/5.0"' },
  { g: "http", t: '10.0.0.7 - - [23/Oct/2026:17:06:00 +0000] "GET /missing HTTP/1.1" 404 - "-" "Wget/1.21"' },
  { g: "http", t: '172.16.4.9 - bruno [23/Oct/2026:17:06:41 +0000] "GET /static/app.js HTTP/1.1" 200 88211 "-" "Mozilla/5.0"' },
  { g: "kv", t: "2026-10-23 17:05:09 login usuario=ana ip=10.0.0.5 acao=entrar duracao=12.5ms" },
  { g: "kv", t: "2026-10-23 17:05:44 login usuario=Bruno ip=192.168.1.20 acao=sair duracao=3ms" },
  { g: "kv", t: "2026-10-23 17:06:12 login usuario=carla ip=10.0.0.9 acao=entrar duracao=12,5ms" },
  { g: "kv", t: "2026-10-23 17:07:30 login usuario=ana ip=10.0.0.5 acao=sair duracao=250ms" },
  { g: "other", t: "[WARN] disco quase cheio em /var/log (92%)" },
  { g: "other", t: "Traceback (most recent call last): worker-3 falhou" },
];
const GROUPS = {
  http: { name: "Acesso HTTP", pop: 71000, known: "Log de acesso HTTP detectado" },
  kv: { name: "Aplicativo", pop: 44000, known: null },
  other: { name: "Outras", pop: 5000, known: null },
};
const COLORS = ["#2f7fd1", "#e07a1f", "#2b9a57", "#b254c0", "#c79a1b", "#d4476a", "#2aa79b", "#7a6ee0", "#8aa02a", "#c8795a"];
// ---------- detectores (no aplicativo: sugestões locais do backend) ----------
const DET = [
  ["data", /\b\d{2}\/[A-Z][a-z]{2}\/\d{4}:\d{2}:\d{2}:\d{2} [+-]\d{4}/g, "data/hora"],
  ["data", /\b\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\b/g, "data/hora"],
  ["ip", /\b(?:\d{1,3}\.){3}\d{1,3}\b/g, "IP"],
  ["caminho", /(?<=[A-Z]+ )\/[^\s"]*/g, "texto"],
  ["metodo", /(?<=")[A-Z]{3,7}(?= \/)/g, "texto"],
  ["status", /(?<=" )\d{3}(?= )/g, "inteiro"],
  ["bytes", /(?<=" \d{3} )(?:\d+|-)(?= )/g, "inteiro"],
  ["usuario", /(?<=\busuario=)\S+/g, "texto"],
  ["acao", /(?<=\bacao=)\S+/g, "texto"],
  ["duracao", /(?<=\bduracao=)[\d.,]+(?=ms)/g, "decimal"],
];
function chipsOf(text) {
  const out = [];
  for (const [kind, re, type] of DET) for (const m of text.matchAll(re)) {
    const s = m.index, e = s + m[0].length;
    if (!out.some(c => c.s < e && s < c.e)) out.push({ kind, s, e, type, text: m[0] });
  }
  return out.sort((a, b) => a.s - b.s);
}
const nameFor = (text, c) => c.kind === "data" ? "quando" : c.kind === "ip" ? (/ip=$/.test(text.slice(Math.max(0, c.s - 3), c.s)) ? "ip" : "cliente") : c.kind;
// ---------- estado ----------
let state = { group: "http", cols: { http: [], kv: [], other: [] }, ignored: {}, sample: { http: 0, kv: 0, other: 0 }, origin: null, focus: -1, taught: {}, extra: [] };
const history = [];

  else if (state.focus >= 0 && (e.key === "i" || e.key === "I")) { e.preventDefault(); remember(); const c = chips[state.focus]; state.ignored[state.group + ":" + c.s + ":" + text.length] = true; renderAll(); $("#line").focus(); }
  else if (state.focus >= 0 && e.key === "Delete") { e.preventDefault(); const c = chips[state.focus], ci = colAt(c, text); if (ci >= 0) { remember(); cols().splice(ci, 1); renderAll(); $("#line").focus(); } }
});
// ---------- diversos ----------
$("#prev").onclick = () => { state.sample[state.group]--; renderAll(); };
$("#next").onclick = () => { state.sample[state.group]++; renderAll(); };
$("#undo").onclick = undo;
$("#paste").addEventListener("keydown", e => { if (e.key === "Enter") $("#paste-add").click(); });
$("#paste-add").onclick = () => { const t = $("#paste").value.trim(); if (!t) return; state.extra.push({ g: state.group, t }); state.sample[state.group] = lines(state.group).length - 1; $("#paste").value = ""; renderAll(); };
$("#theme").onclick = () => { const r = document.documentElement; r.dataset.theme = (r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark" ? "light" : "dark"; };
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { $("#easy").hidden = b.dataset.tab !== "easy"; $("#adv").hidden = b.dataset.tab !== "adv"; });
document.addEventListener("click", e => { const b = e.target.closest("[data-info]"); if (!b) return; const [t, body] = INFO[b.dataset.info]; $("#info-title").textContent = t; $("#info-body").innerHTML = body; $("#info").showModal(); });
$("#apply").onclick = () => {
  const made = Object.entries(state.cols).filter(([, c]) => c.length);
  if (!made.length) return toast("Ensine um tipo de linha primeiro");
  $("#dlg-body").innerHTML = `<ul>${made.map(([g, c]) => `<li><b>${esc(GROUPS[g].name)}</b> · ${Math.round(coverage(g) * 100)}%<br>${c.map(x => "<code>norm." + esc(x.name) + "</code>").join(" ")}</li>`).join("")}</ul>`;
  $("#dlg").showModal();
};
$("#dlg").addEventListener("close", () => { if ($("#dlg").returnValue === "ok") toast("Aplicado ao Caso"); });
paintIcons(); renderAll();
</script>
</body>

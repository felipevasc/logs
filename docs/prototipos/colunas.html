<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colunas — protótipo</title>
<style>
:root { --bg:#f4f5f7; --panel:#fff; --ink:#1c2230; --muted:#8a93a6; --line:#e6e9ef; --soft:#f0f2f6; --accent:#e07a1f; --accent-soft:#fdf0e3; --ok:#2b9a57; --warn:#c98a1b; --bad:#d23f3f; --mono:ui-monospace,"Cascadia Code",Consolas,monospace; --shadow:0 10px 30px rgba(20,28,45,.16); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#12151c; --panel:#1a1f29; --ink:#e8ebf2; --muted:#7f8aa0; --line:#2a3140; --soft:#232a37; --accent:#f29a4b; --accent-soft:#35261a; --ok:#54c27e; --warn:#e3b25a; --bad:#ff8585; --shadow:0 10px 30px rgba(0,0,0,.5); } }
:root[data-theme="dark"] { --bg:#12151c; --panel:#1a1f29; --ink:#e8ebf2; --muted:#7f8aa0; --line:#2a3140; --soft:#232a37; --accent:#f29a4b; --accent-soft:#35261a; --ok:#54c27e; --warn:#e3b25a; --bad:#ff8585; --shadow:0 10px 30px rgba(0,0,0,.5); }
* { box-sizing:border-box; } [hidden] { display:none !important; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,"Segoe UI",sans-serif; padding-bottom:260px; }
button { font:inherit; color:inherit; cursor:pointer; }
svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.ib { display:inline-grid; place-items:center; width:30px; height:30px; border:0; border-radius:8px; background:none; color:var(--muted); }
.ib:hover:not(:disabled) { background:var(--soft); color:var(--ink); } .ib:disabled { opacity:.35; cursor:default; }
.i { display:inline-grid; place-items:center; width:18px; height:18px; border:0; background:none; color:var(--muted); border-radius:50%; padding:0; opacity:.7; vertical-align:middle; }
.i:hover { opacity:1; color:var(--accent); } .i svg { width:14px; height:14px; }
.btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:6px 12px; }
.btn:hover { border-color:var(--accent); } .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; } .btn.small { padding:3px 10px; font-size:13px; }
.top { display:flex; align-items:center; gap:6px; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.top h1 { font-size:15px; margin:0 10px 0 0; } .grow { flex:1; }
.tabs { display:flex; gap:4px; flex-wrap:wrap; }
.tab { border:1px solid transparent; background:none; border-radius:999px; padding:5px 14px; color:var(--muted); }
.tab[aria-selected="true"] { background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600; } .tab small { color:var(--muted); font-weight:400; margin-left:6px; }
main { max-width:1100px; margin:0 auto; padding:18px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:14px; }
.card.draft { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.head { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.sec { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); flex:1; display:flex; align-items:center; gap:4px; }
.record { font:14px/1.9 var(--mono); padding:10px 14px; border-radius:10px; background:var(--soft); white-space:pre-wrap; overflow-wrap:anywhere; user-select:text; cursor:text; max-height:230px; overflow:auto; }
.m { border-radius:5px; padding:1px 2px; box-shadow:inset 0 -2px 0 var(--c); background:color-mix(in srgb, var(--c) 20%, transparent); }
.m::after { content:attr(data-name); font:700 10px system-ui; margin-left:4px; color:var(--c); filter:brightness(.85); user-select:none; }
.m.exists { background:none; box-shadow:inset 0 -2px 0 var(--muted); } .m.exists::after { color:var(--muted); }
.m.draft { --c:var(--accent); background:color-mix(in srgb, var(--accent) 26%, transparent); outline:2px dashed var(--accent); outline-offset:1px; }
.m.cand { background:none; box-shadow:inset 0 -2px 0 var(--line); cursor:pointer; } .m.cand::after { content:""; } .m.cand:hover { background:var(--accent-soft); box-shadow:inset 0 -2px 0 var(--accent); }
.recrow { display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--muted); font-size:12px; flex-wrap:wrap; }
.recrow code { font:12px var(--mono); background:var(--soft); padding:2px 8px; border-radius:6px; color:var(--ink); }
.namerow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
.name { flex:1 1 200px; min-width:160px; border:1px solid var(--line); background:var(--soft); color:var(--ink); border-radius:10px; padding:8px 12px; font:600 15px var(--mono); }
.name:focus { outline:2px solid var(--accent); } .name.bad { outline:2px solid var(--bad); }
.typebtn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--soft); border-radius:10px; padding:8px 12px; }
.typebtn:hover { border-color:var(--accent); } .typebtn small { color:var(--muted); }
.sugg { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px; font-size:12px; color:var(--muted); }
.sugg button { border:1px solid var(--line); background:none; border-radius:999px; padding:2px 10px; font:12px var(--mono); } .sugg button:hover { border-color:var(--accent); background:var(--accent-soft); }
.opts { display:grid; gap:4px; max-height:230px; overflow:auto; margin-bottom:10px; }
.opt { display:grid; grid-template-columns:18px 1fr auto; gap:10px; align-items:center; text-align:left; border:1px solid var(--line); background:none; border-radius:10px; padding:7px 10px; }
.opt:hover { border-color:var(--accent); } .opt[aria-checked="true"] { border-color:var(--accent); background:var(--accent-soft); }
.opt .rd { width:14px; height:14px; border-radius:50%; border:2px solid var(--muted); } .opt[aria-checked="true"] .rd { border-color:var(--accent); background:radial-gradient(var(--accent) 45%, transparent 50%); }
.opt b { font-weight:600; } .opt code { display:block; font:11px var(--mono); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:560px; }
.opt .why { display:block; font-size:12px; color:var(--muted); margin:1px 0 2px; }
.badges { display:flex; gap:4px; flex-wrap:wrap; margin:2px 0; } .bd { font-size:10px; border:1px solid var(--line); border-radius:999px; padding:0 7px; color:var(--muted); } .bd.ok { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 40%, transparent); } .bd.warn { color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, transparent); }
.opt .ex { font:11px var(--mono); color:var(--muted); display:block; }
.cov { font-size:11px; border-radius:999px; padding:1px 9px; background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok); white-space:nowrap; } .cov.mid { background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); } .cov.low { background:color-mix(in srgb, var(--bad) 16%, transparent); color:var(--bad); }
.rec { font-size:10px; border-radius:999px; padding:0 7px; margin-left:6px; background:var(--accent); color:#fff; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; } .seg button { border:0; background:none; padding:4px 14px; color:var(--muted); } .seg button[aria-pressed="true"] { background:var(--accent-soft); color:var(--ink); font-weight:600; }
textarea.expr { width:100%; min-height:56px; resize:vertical; border:1px solid var(--line); background:var(--soft); color:var(--ink); border-radius:10px; padding:10px 12px; font:14px/1.5 var(--mono); } textarea.expr:focus { outline:2px solid var(--accent); }
.status { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:var(--muted); } .status.bad { color:var(--bad); }
.empty { color:var(--muted); display:flex; align-items:center; gap:8px; }
.dock { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); box-shadow:0 -8px 24px rgba(20,28,45,.12); padding:8px 18px 12px; max-height:230px; overflow:auto; }
.dock .in { max-width:1100px; margin:0 auto; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th, td { padding:6px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; max-width:380px; overflow:hidden; text-overflow:ellipsis; }
th { font-weight:650; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; position:sticky; top:0; background:var(--panel); z-index:1; }
tbody tr { cursor:context-menu; } tbody tr:hover td { background:var(--soft); }
tr.draftrow td { background:color-mix(in srgb, var(--accent) 14%, transparent) !important; font-weight:600; }
td .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:var(--c); } td .tag { font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:0 7px; margin-left:8px; font-weight:400; } td .tag.new { color:var(--accent); border-color:var(--accent); }
td.ex { font-family:var(--mono); font-size:12px; color:var(--muted); font-weight:400; } td.ty { cursor:pointer; } td.ty:hover { color:var(--accent); } td.nm { cursor:text; }
td input { font:inherit; border:1px solid var(--accent); background:var(--soft); color:var(--ink); border-radius:6px; padding:1px 6px; width:170px; }
.menu { position:fixed; z-index:50; min-width:250px; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:5px; }
.menu .t { font-size:11px; color:var(--muted); padding:5px 10px; max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.menu button { display:flex; width:100%; gap:10px; align-items:center; border:0; background:none; border-radius:8px; padding:7px 10px; text-align:left; } .menu button:hover { background:var(--accent-soft); } .menu button.first { font-weight:650; } .menu button svg { color:var(--muted); } .menu hr { border:0; border-top:1px solid var(--line); margin:4px 2px; }
.seltip { position:fixed; z-index:60; display:inline-flex; align-items:center; gap:6px; border:0; border-radius:999px; background:var(--ink); color:var(--bg); padding:6px 14px; font-weight:600; box-shadow:var(--shadow); }
.seltip:hover { background:var(--accent); color:#fff; }
.toast { position:fixed; left:50%; bottom:250px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:999px; z-index:70; font-size:13px; }
dialog { border:1px solid var(--line); border-radius:18px; background:var(--panel); color:var(--ink); width:min(540px,calc(100vw - 24px)); padding:20px 22px; box-shadow:var(--shadow); }
dialog::backdrop { background:rgba(10,14,24,.45); } dialog h2 { font-size:16px; margin:0 0 10px; } dialog p { margin:0 0 10px; color:var(--muted); }
dialog input.q { display:block; width:100%; margin:0 0 8px; border:1px solid var(--line); background:var(--soft); color:var(--ink); border-radius:8px; padding:7px 10px; }
dialog .row { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; } dialog code { font:12px var(--mono); background:var(--soft); padding:1px 6px; border-radius:5px; }
.tp { max-height:52vh; overflow:auto; } .tp h3 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:12px 0 4px; }
.tp button { display:flex; width:100%; justify-content:space-between; gap:10px; text-align:left; border:0; background:none; border-radius:8px; padding:6px 10px; } .tp button:hover { background:var(--accent-soft); } .tp button[aria-current="true"] { background:var(--accent-soft); font-weight:650; } .tp small { color:var(--muted); font:11px var(--mono); }
.tag-proto { position:fixed; left:50%; transform:translateX(-50%); top:1px; font-size:10px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; opacity:.7; pointer-events:none; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<span class="tag-proto">protótipo · dados simulados</span>
<header class="top">
  <h1>Colunas</h1><div class="tabs" id="tabs" role="tablist"></div><span class="grow"></span>
  <button class="ib" id="undo" type="button" title="Desfazer" aria-label="Desfazer"></button>
  <button class="ib" data-info="geral" type="button" title="Como usar" aria-label="Como usar"></button>
  <button class="ib" id="theme" type="button" title="Tema" aria-label="Tema"></button>
  <button class="btn primary" id="apply" type="button"></button>
</header>
<main>
  <div class="card">
    <div class="head"><div class="sec">Amostra <button class="i" data-info="amostra" type="button" aria-label="Mais informações"></button></div>
      <button class="ib" id="prev" type="button" aria-label="Anterior"></button><small id="pos" style="color:var(--muted)"></small><button class="ib" id="next" type="button" aria-label="Próxima"></button></div>
    <div class="record" id="record" tabindex="0"></div>
    <div class="recrow"><span>Registro começa com</span><code id="start"></code><button class="ib" id="start-edit" type="button" title="Definir o que é um registro" aria-label="Definir o que é um registro"></button><button class="i" data-info="registro" type="button" aria-label="Mais informações"></button></div>
  </div>
  <div class="card" id="newcard"></div>
</main>
<div class="dock"><div class="in">
  <div class="head"><div class="sec">Colunas <button class="i" data-info="tabela" type="button" aria-label="Mais informações"></button></div></div>
  <table><thead><tr><th>Coluna</th><th>Tipo</th><th>Exemplos</th></tr></thead><tbody id="rows"></tbody></table>
</div></div>
<button class="seltip" id="seltip" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 5.3L20 10l-5.8 1.7L12 17l-2.2-5.3L4 10l5.8-1.7z"/></svg>Criar coluna</button>
<div class="menu" id="menu" hidden></div><div class="toast" id="toast" hidden role="status"></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const IC = { info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>', check:'<path d="M5 12l5 5 9-10"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', moon:'<path d="M20 14a8 8 0 1 1-9-10 6 6 0 0 0 9 10z"/>', undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>', left:'<path d="M15 6l-6 6 6 6"/>', right:'<path d="M9 6l6 6-6 6"/>', edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>', col:'<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M10 5v14M4 11h16"/>', trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>', type:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>', copy:'<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>', plus:'<path d="M12 5v14M5 12h14"/>', search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>' };
const svg = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

// ---------- catálogo de tipos (referências: ECS, padrões Grok, Splunk CIM) ----------
// b = tipo base da conversão; re = como o valor se parece; tok = padrão Grok pronto (quando existe)
const TYPES = [
  { id:"texto", g:"Básicos", l:"Texto", b:"texto", ex:"abc" }, { id:"inteiro", g:"Básicos", l:"Inteiro", b:"inteiro", re:"-?\\d+", tok:"INT", ex:"42" },
  { id:"decimal", g:"Básicos", l:"Decimal", b:"decimal", re:"-?\\d+\\.\\d+", tok:"NUMBER", ex:"12.5" }, { id:"booleano", g:"Básicos", l:"Verdadeiro/falso", b:"booleano", re:"(?:true|false|sim|não|yes|no)", ex:"true" },
  { id:"iso", g:"Data e hora", l:"Data e hora ISO 8601", b:"data-hora", re:"\\d{4}-\\d\\d-\\d\\d[T ]\\d\\d:\\d\\d:\\d\\d(?:[.,]\\d+)?(?:Z|[+-]\\d\\d:?\\d\\d)?", tok:"TIMESTAMP_ISO8601", ex:"2026-10-23 17:05:09" },
  { id:"httpdate", g:"Data e hora", l:"Data e hora de log HTTP", b:"data-hora", re:"\\d\\d/[A-Z][a-z]{2}/\\d{4}:\\d\\d:\\d\\d:\\d\\d [+-]\\d{4}", tok:"HTTPDATE", ex:"23/Oct/2026:17:05:09 +0000" },
  { id:"syslogdate", g:"Data e hora", l:"Data e hora de syslog", b:"data-hora", re:"[A-Z][a-z]{2} +\\d{1,2} \\d\\d:\\d\\d:\\d\\d", tok:"SYSLOGTIMESTAMP", ex:"Oct 23 17:05:09" },
  { id:"epoch_ms", g:"Data e hora", l:"Epoch em milissegundos", b:"data-hora", re:"\\d{13}", ex:"1729702509123" }, { id:"epoch_s", g:"Data e hora", l:"Epoch em segundos", b:"data-hora", re:"\\d{10}", ex:"1729702509" },
  { id:"data_br", g:"Data e hora", l:"Data dd/mm/aaaa", b:"data-hora", re:"\\d\\d/\\d\\d/\\d{4}", ex:"23/10/2026" }, { id:"hora", g:"Data e hora", l:"Hora hh:mm:ss", b:"texto", re:"\\d\\d:\\d\\d:\\d\\d(?:[.,]\\d+)?", tok:"TIME", ex:"17:05:09" },
  { id:"duracao", g:"Data e hora", l:"Duração (ms, s, min, h)", b:"decimal", re:"\\d+(?:\\.\\d+)?\\s?(?:ms|s|min|h)", ex:"12.5ms" },
  { id:"ipv4", g:"Rede", l:"Endereço IPv4", b:"ip", re:"(?:\\d{1,3}\\.){3}\\d{1,3}", tok:"IP", ex:"10.0.0.5" }, { id:"ipv6", g:"Rede", l:"Endereço IPv6", b:"ip", re:"(?:[0-9a-fA-F]{1,4}:){2,7}[0-9a-fA-F]{1,4}", tok:"IP", ex:"2001:db8::1" },
  { id:"cidr", g:"Rede", l:"Rede (CIDR)", b:"texto", re:"(?:\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}", ex:"10.0.0.0/8" }, { id:"porta", g:"Rede", l:"Porta", b:"inteiro", re:"\\d{1,5}", ex:"443" },
  { id:"mac", g:"Rede", l:"Endereço MAC", b:"texto", re:"(?:[0-9a-fA-F]{2}[:-]){5}[0-9a-fA-F]{2}", tok:"MAC", ex:"00:1a:2b:3c:4d:5e" }, { id:"url", g:"Rede", l:"URL", b:"texto", re:"[a-zA-Z][a-zA-Z0-9+.-]*://\\S+", tok:"URI", ex:"https://exemplo.com/a" },
  { id:"dominio", g:"Rede", l:"Domínio", b:"texto", re:"(?:[a-z0-9-]+\\.)+[a-z]{2,}", tok:"HOSTNAME", ex:"exemplo.com" }, { id:"email", g:"Rede", l:"E-mail", b:"texto", re:"[\\w.+-]+@[\\w-]+(?:\\.[\\w-]+)+", tok:"EMAILADDRESS", ex:"ana@exemplo.com" },
  { id:"metodo", g:"Web", l:"Método HTTP", b:"texto", re:"(?:GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)", ex:"GET" }, { id:"status", g:"Web", l:"Código de resposta HTTP", b:"inteiro", re:"[1-5]\\d\\d", ex:"404" }, { id:"useragent", g:"Web", l:"User-agent", b:"texto", re:"Mozilla/[^\"]+", ex:"Mozilla/5.0 …" },
  { id:"uuid", g:"Identificadores", l:"UUID / GUID", b:"texto", re:"[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}", tok:"UUID", ex:"123e4567-e89b-12d3-a456-426614174000" },
  { id:"md5", g:"Identificadores", l:"Hash MD5", b:"texto", re:"[0-9a-fA-F]{32}", ex:"d41d8cd9…" }, { id:"sha1", g:"Identificadores", l:"Hash SHA-1", b:"texto", re:"[0-9a-fA-F]{40}", ex:"da39a3ee…" }, { id:"sha256", g:"Identificadores", l:"Hash SHA-256", b:"texto", re:"[0-9a-fA-F]{64}", ex:"e3b0c442…" },
  { id:"hex", g:"Identificadores", l:"Número hexadecimal", b:"texto", re:"0[xX][0-9a-fA-F]+", tok:"HEX", ex:"0x2a" }, { id:"sid", g:"Identificadores", l:"SID do Windows", b:"texto", re:"S-1-5-(?:\\d+-)+\\d+", ex:"S-1-5-21-…" }, { id:"pid", g:"Identificadores", l:"ID de processo (PID)", b:"inteiro", re:"\\d{1,7}", ex:"4242" },
  { id:"winpath", g:"Arquivos e sistema", l:"Caminho do Windows", b:"texto", re:"[A-Za-z]:\\\\(?:[^\\\\/:*?\"<>|\\r\\n]+\\\\)*[^\\\\/:*?\"<>|\\r\\n]*", tok:"WINPATH", ex:"C:\\Windows\\cmd.exe" }, { id:"unixpath", g:"Arquivos e sistema", l:"Caminho Unix", b:"texto", re:"(?:/[\\w.-]+)+", tok:"UNIXPATH", ex:"/var/log/app.log" },

function nameSuggestions(c) { const out = (c.names || []).map(clean); for (const n of ECS[c.typeId] || []) out.push(n); out.push(clean(T(c.typeId).l.split(" ")[0])); return [...new Set(out.filter(n => n && n.length > 1))].slice(0, 5); }
const uniq = (n, except) => { const t = new Set(allNames().filter(x => x !== except)); let x = n, k = 2; while (t.has(x)) x = n + "_" + k++; return x; };

// ---------- rascunho (nova coluna) ----------
function startDraft(s, e) {
  const rec = L().records[idx()].raw; if (e - s < 1) return;
  const cands = candidates(rec, s, e); if (!cands.length) return toast("Nenhum padrão encaixa neste trecho");
  const sg = nameSuggestions(cands[0]);
  S.draft = { s, e, rec, cands, pick:0, name:uniq(sg[0] || "campo"), typeId:cands[0].typeId, typed:null, nameTouched:false, typeTouched:false };
  renderAll(); const n = $("#nameinput"); if (n && !S.draft.nameTouched) { /* mantém a seleção do texto */ }
}
const cur = () => { const d = S.draft; return d && (d.typed != null ? { re:reFromTyped(d.typed), custom:true } : d.cands[d.pick]); };
function pick(i) { const d = S.draft; d.pick = i; d.typed = null; if (!d.typeTouched) d.typeId = d.cands[i].typeId; if (!d.nameTouched) { const sg = nameSuggestions(d.cands[i]); d.name = uniq(sg[0] || "campo"); } renderAll(); }
function commit() {
  const d = S.draft; if (!d) return; const c = cur(); if (!d.name.trim()) return toast("Dê um nome à coluna");
  if (allNames().includes(d.name)) return toast("Já existe uma coluna com esse nome");
  remember();
  const f = d.typed != null ? { grok:d.typed, regex:d.typed } : d.cands[d.pick].forms(d.name);
  S.cols[S.type].push({ name:d.name, typeId:d.typeId, re:c.re, grok:f.grok, regex:f.regex, mode:S.mode });
  S.draft = null; renderAll(); toast(`Coluna “${d.name}” criada`);
}
function valuesOf(re) { return L().records.map(r => { try { const m = new RegExp(re, "d").exec(r.raw); return m ? m[1] : null; } catch { return null; } }); }
function rangeIn(re, rec) { try { const m = new RegExp(re, "d").exec(rec); return m && m.indices[1] ? m.indices[1] : null; } catch { return null; } }

// ---------- render ----------
function renderTabs() {
  $("#tabs").innerHTML = Object.entries(TYPES_OF_LOG).map(([id, t]) => `<button class="tab" role="tab" data-t="${id}" aria-selected="${id === S.type}">${esc(t.name)}<small>${t.pop.toLocaleString("pt-BR")} registros</small></button>`).join("");
  $("#tabs").querySelectorAll("[data-t]").forEach(b => b.onclick = () => { S.type = b.dataset.t; S.draft = null; renderAll(); });
}
function marks(rec) {
  const out = [];
  for (const [n, v] of Object.entries(rec.exists)) { const i = rec.raw.indexOf(v); if (i >= 0) out.push({ s:i, e:i + v.length, cls:"exists", name:n, c:"var(--muted)" }); }
  for (const c of S.cols[S.type]) { const r = rangeIn(c.re, rec.raw); if (r) out.push({ s:r[0], e:r[1], cls:"col", name:c.name, c:color(c.name) }); }
  if (S.draft) { const c = cur(), r = c && rangeIn(c.re, rec.raw); if (r) out.push({ s:r[0], e:r[1], cls:"draft", name:S.draft.name }); }
  const taken = out.slice();
  for (const t of ["ipv4", "iso", "classe", "excecao", "duracao", "uuid", "email", "url", "status", "semver", "bytes", "hex"]) { const re = new RegExp(T(t).re, "g"); for (const m of rec.raw.matchAll(re)) { const s = m.index, e = s + m[0].length; if (!taken.some(x => x.s < e && s < x.e) && !(t === "status" && !/" \d{3}$/.test(rec.raw.slice(0, e)))) { out.push({ s, e, cls:"cand", name:t, c:"var(--line)" }); taken.push({ s, e }); } } }
  return out.sort((a, b) => a.s - b.s || (a.cls === "draft" ? -1 : 1)).filter((m, i, a) => !a.slice(0, i).some(x => x.e > m.s));
}
function renderRecord() {
  const rec = L().records[idx()], ms = marks(rec); let html = "", cur2 = 0;
  ms.forEach((m, i) => { html += esc(rec.raw.slice(cur2, m.s)) + `<span class="m ${m.cls}" data-i="${i}" data-name="${esc(m.cls === "cand" ? "" : m.name)}" style="--c:${m.c}">${esc(rec.raw.slice(m.s, m.e))}</span>`; cur2 = m.e; });
  html += esc(rec.raw.slice(cur2));
  const el = $("#record"); el.innerHTML = html; el._marks = ms;
  $("#pos").textContent = `${idx() + 1}/${L().records.length}`; $("#prev").disabled = idx() === 0; $("#next").disabled = idx() >= L().records.length - 1; $("#start").textContent = L().start;
  el.querySelectorAll(".m.cand").forEach(sp => sp.onclick = ev => { ev.stopPropagation(); const m = ms[+sp.dataset.i]; startDraft(m.s, m.e); });
}
function covClass(c) { return c.cover === c.total ? "" : c.cover === 0 ? "low" : "mid"; }
function renderNew() {
  const d = S.draft, box = $("#newcard"); box.className = "card" + (d ? " draft" : "");
  if (!d) { box.innerHTML = `<div class="head"><div class="sec">Nova coluna <button class="i" data-info="nova" type="button" aria-label="Mais informações"></button></div></div><div class="empty">${svg("col")}<span>Selecione um trecho da amostra ou clique num pedaço sublinhado</span></div>`; box.querySelectorAll(".i").forEach(b => b.innerHTML = svg("info")); return; }
  const sg = nameSuggestions(d.cands[d.pick]), ty = T(d.typeId), c = cur(), dup = allNames().includes(d.name);
  box.innerHTML = `<div class="head"><div class="sec">Nova coluna <button class="i" data-info="nova" type="button" aria-label="Mais informações"></button></div>
      <button class="ib" id="d-cancel" type="button" title="Cancelar" aria-label="Cancelar">${svg("x")}</button><button class="btn primary small" id="d-ok" type="button">${svg("check")}Adicionar</button></div>
    <div class="namerow"><input class="name ${dup ? "bad" : ""}" id="nameinput" value="${esc(d.name)}" spellcheck="false" aria-label="Nome da coluna" placeholder="nome da coluna"><button class="typebtn" id="typebtn" type="button" aria-label="Escolher o tipo">${svg("type")}${esc(ty.l)}<small>${esc(ty.b)}</small></button></div>
    <div class="sugg"><span>Nomes:</span>${sg.map(n => `<button type="button" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    <div class="head"><div class="sec">Padrões possíveis <span style="text-transform:none;letter-spacing:0;color:var(--muted)">· ${d.cands.length} verificados (de ${d.cands.total || d.cands.length} testados)</span> <button class="i" data-info="padroes" type="button" aria-label="Mais informações"></button></div></div>
    <div class="opts" role="radiogroup" aria-label="Padrões possíveis">${d.cands.map((p, i) => i >= (d.all ? 40 : 8) && i !== d.pick ? "" : `<button class="opt" role="radio" aria-checked="${d.typed == null && i === d.pick}" data-p="${i}"><span class="rd"></span><span><b>${esc(p.label)}</b>${p.rec ? '<span class="rec">recomendado</span>' : ""}<span class="why">${esc(p.why || "")}</span><span class="badges">${p.once && p.cover === p.total ? '<span class="bd ok">estável</span>' : p.once ? "" : '<span class="bd warn">acha mais de um em alguma amostra</span>'}${p.homog ? '<span class="bd">formato parecido nas amostras</span>' : ""}${p.alts ? `<span class="bd">+${p.alts} equivalentes</span>` : ""}</span><code>${esc(exprOf(p, d.name || "campo"))}</code><span class="ex">${esc(p.values.filter(v => v != null).slice(0, 3).join("  ·  "))}</span></span><span class="cov ${covClass(p)}">${p.cover}/${p.total}</span></button>`).join("")}</div>
    ${d.cands.length > 8 ? `<button class="btn small" id="more" type="button" style="margin-bottom:10px">${d.all ? "Mostrar só as melhores" : `Ver todas as ${d.cands.length} possibilidades verificadas`}</button>` : ""}
    <div class="head"><div class="sec">Expressão</div><div class="seg" role="group" aria-label="Tipo de expressão"><button id="m-grok" aria-pressed="${S.mode === "grok"}">Grok</button><button id="m-regex" aria-pressed="${S.mode === "regex"}">Regex</button></div></div>
    <textarea class="expr" id="expr" spellcheck="false" aria-label="Expressão">${esc(d.typed != null ? d.typed : exprOf(d.cands[d.pick], d.name || "campo"))}</textarea>
    <div class="status" id="status"></div>`;
  box.querySelectorAll(".i").forEach(b => b.innerHTML = svg("info"));
  const stat = () => { const v = valuesOf(cur().re), ok = v.filter(x => x != null).length; $("#status").className = "status"; $("#status").innerHTML = `${svg("check")}<span>Encaixa em <b>${ok} de ${v.length}</b> amostras</span>`; }; stat();
  $("#d-ok").onclick = commit; if ($("#more")) $("#more").onclick = () => { d.all = !d.all; renderAll(); }; $("#d-cancel").onclick = () => { S.draft = null; renderAll(); };
  $("#nameinput").oninput = e => { d.name = e.target.value.trim().replace(/\s+/g, "_"); d.nameTouched = true; renderRows(); const x = $("#expr"); if (d.typed == null) x.value = exprOf(d.cands[d.pick], d.name || "campo"); box.querySelectorAll(".opt code").forEach((cd, i) => cd.textContent = exprOf(d.cands[i], d.name || "campo")); $("#nameinput").classList.toggle("bad", allNames().includes(d.name)); };
  $("#nameinput").onkeydown = e => { if (e.key === "Enter") commit(); };
  box.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { d.name = b.dataset.n; d.nameTouched = true; renderAll(); });
  box.querySelectorAll("[data-p]").forEach(b => b.onclick = () => pick(+b.dataset.p));
  $("#typebtn").onclick = () => typePicker(d.typeId, id => { d.typeId = id; d.typeTouched = true; renderAll(); });
  $("#m-grok").onclick = () => { S.mode = "grok"; renderAll(); }; $("#m-regex").onclick = () => { S.mode = "regex"; renderAll(); };
  $("#expr").oninput = e => { d.typed = e.target.value; try { reFromTyped(d.typed); new RegExp(reFromTyped(d.typed)); } catch (er) { $("#status").className = "status bad"; $("#status").textContent = String(er.message || er); renderRecord(); renderRows(); return; } box.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-checked", "false")); stat(); renderRecord(); renderRows(); };
}
function renderRows() {
  const rows = [], recs = L().records;
  if (S.draft) { const v = valuesOf(cur().re); rows.push(`<tr class="draftrow"><td><span class="dot" style="--c:var(--accent)"></span>${esc(S.draft.name || "(sem nome)")}<span class="tag new">novo</span></td><td>${esc(T(S.draft.typeId).l)}</td><td class="ex">${esc(v.filter(Boolean).slice(0, 3).join("  ·  "))}</td></tr>`); }
  S.cols[S.type].forEach((c, i) => { const v = valuesOf(c.re); rows.push(`<tr data-c="${i}"><td class="nm" data-nm="${i}"><span class="dot" style="--c:${color(c.name)}"></span>${esc(c.name)}</td><td class="ty" data-ty="${i}">${esc(T(c.typeId).l)}</td><td class="ex">${esc(v.filter(Boolean).slice(0, 3).join("  ·  "))}</td></tr>`); });
  for (const k of Object.keys(recs[0].exists)) rows.push(`<tr data-ex="1"><td><span class="dot" style="--c:var(--muted)"></span>${esc(k)}<span class="tag">já existe</span></td><td>${esc(T(/^\d+$/.test(recs[0].exists[k]) ? "inteiro" : "texto").l)}</td><td class="ex">${esc(recs.map(r => r.exists[k]).filter(Boolean).slice(0, 3).join("  ·  "))}</td></tr>`);
  $("#rows").innerHTML = rows.join("");
  $("#rows").querySelectorAll("[data-c]").forEach(tr => tr.oncontextmenu = e => { e.preventDefault(); rowMenu(+tr.dataset.c, e.clientX, e.clientY); });
  $("#rows").querySelectorAll("[data-nm]").forEach(td => td.ondblclick = () => rename(+td.dataset.nm));
  $("#rows").querySelectorAll("[data-ty]").forEach(td => td.onclick = () => { const c = S.cols[S.type][+td.dataset.ty]; typePicker(c.typeId, id => { remember(); c.typeId = id; renderAll(); }); });
}
function rename(i) {
  const td = $(`[data-nm="${i}"]`), c = S.cols[S.type][i]; td.innerHTML = `<input value="${esc(c.name)}" aria-label="Novo nome">`; const inp = td.querySelector("input"); inp.focus(); inp.select();
  const done = ok => { if (ok) { const n = clean(inp.value) || c.name; if (n !== c.name && allNames().includes(n)) { toast("Já existe uma coluna com esse nome"); } else if (n !== c.name) { remember(); c.name = n; } } renderAll(); };
  inp.onkeydown = e => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); }; inp.onblur = () => done(true);
}
function renderAll() { renderTabs(); renderRecord(); renderNew(); renderRows(); }

// ---------- seleção, menus, diálogos ----------
const menu = $("#menu");
function showMenu(items, x, y, title) {
  menu.innerHTML = (title ? `<div class="t">${esc(title)}</div>` : "") + items.map((it, i) => it === "-" ? "<hr>" : `<button type="button" data-i="${i}" class="${it.first ? "first" : ""}">${svg(it.icon || "col")}${esc(it.label)}</button>`).join("");
  menu.hidden = false; menu.style.left = Math.max(8, Math.min(x, innerWidth - menu.offsetWidth - 8)) + "px"; menu.style.top = Math.max(8, Math.min(y, innerHeight - menu.offsetHeight - 8)) + "px";
  menu.querySelectorAll("button").forEach(b => b.onclick = () => { const it = items[+b.dataset.i]; menu.hidden = true; it.run(); });
}
document.addEventListener("click", e => { if (!menu.contains(e.target)) menu.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") menu.hidden = true; if ((e.ctrlKey || e.metaKey) && e.key === "z" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); undo(); } });
function selection() { const sel = getSelection(), el = $("#record"); if (!sel || sel.isCollapsed || !el.contains(sel.anchorNode) || !el.contains(sel.focusNode)) return null; const at = (n, o) => { const r = document.createRange(); r.selectNodeContents(el); r.setEnd(n, o); return r.toString().length; }; let s = at(sel.anchorNode, sel.anchorOffset), e = at(sel.focusNode, sel.focusOffset); if (s > e) [s, e] = [e, s]; return s === e ? null : { s, e }; }
// Selecionar o trecho já abre a lista de padrões possíveis.
// Ao selecionar, aparece uma dica sobre o texto; só ao clicar nela os padrões são calculados.
const tip = $("#seltip");
function hideTip() { tip.hidden = true; }
$("#record").addEventListener("mouseup", () => setTimeout(() => {
  const sel = selection(); if (!sel) return hideTip();
  const r = getSelection().getRangeAt(0).getBoundingClientRect();
  tip._sel = sel; tip.hidden = false; tip.style.left = Math.max(8, Math.min(r.right - 20, innerWidth - tip.offsetWidth - 8)) + "px"; tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + "px";
}, 0));
tip.addEventListener("mousedown", e => e.preventDefault());
tip.onclick = () => { const sel = tip._sel; hideTip(); if (sel) startDraft(sel.s, sel.e); };
document.addEventListener("selectionchange", () => { if (!selection()) hideTip(); });
$("#record").addEventListener("contextmenu", ev => {
  let sel = selection(); if (!sel) { const sp = ev.target.closest(".m"); if (sp) { const r = document.createRange(); r.selectNodeContents(sp.firstChild); getSelection().removeAllRanges(); getSelection().addRange(r); sel = selection(); } }
  if (!sel) return; ev.preventDefault();
  showMenu([{ label:"Criar coluna com este trecho", icon:"col", first:true, run:() => startDraft(sel.s, sel.e) }, { label:"Copiar", icon:"copy", run:() => toast("Copiado") }, "-", { label:"Desfazer", icon:"undo", run:undo }], ev.clientX, ev.clientY, `“${L().records[idx()].raw.slice(sel.s, sel.e).slice(0, 28)}”`);
});
function rowMenu(i, x, y) {
  const c = S.cols[S.type][i];
  showMenu([{ label:"Renomear", icon:"edit", first:true, run:() => rename(i) }, { label:"Tipo…", icon:"type", run:() => typePicker(c.typeId, id => { remember(); c.typeId = id; renderAll(); }) }, { label:"Copiar expressão", icon:"copy", run:() => toast("Copiado") }, "-", { label:"Remover coluna", icon:"trash", run:() => { remember(); S.cols[S.type].splice(i, 1); renderAll(); } }], x, y, c.name);
}
function typePicker(current, done) {
  const d = $("#dlg"), groups = [...new Set(TYPES.map(t => t.g))];
  const draw = q => { $("#tp").innerHTML = groups.map(g => { const list = TYPES.filter(t => t.g === g && (!q || (t.l + t.id + g).toLowerCase().includes(q))); return list.length ? `<h3>${esc(g)}</h3>` + list.map(t => `<button data-t="${t.id}" ${t.id === current ? 'aria-current="true"' : ""}><span>${esc(t.l)}</span><small>${esc(t.ex)}</small></button>`).join("") : ""; }).join("") || "<p>Nenhum tipo encontrado.</p>"; $("#tp").querySelectorAll("[data-t]").forEach(b => b.onclick = () => { d.close(); done(b.dataset.t); }); };
  d.innerHTML = `<h2>Tipo da coluna</h2><input class="q" id="tq" placeholder="Buscar tipo…" aria-label="Buscar tipo" autocomplete="off"><div class="tp" id="tp"></div><div class="row"><button class="btn" onclick="$('#dlg').close()">Fechar</button></div>`; d.onclose = null; d.showModal(); draw(""); $("#tq").oninput = e => draw(e.target.value.toLowerCase()); $("#tq").focus();
}
const INFO = {
  geral:["Como usar", "<p>Selecione um trecho da amostra (ou clique num pedaço sublinhado). O aplicativo propõe <b>padrões possíveis</b>: escolha um e veja a coluna nova, em destaque, na tabela.</p><p>Dê um nome, confira o tipo e clique em Adicionar.</p>"],
  amostra:["Amostra", "<p>Cinza: campos que o aplicativo já reconhece. Colorido: colunas que você criou. Tracejado: a coluna em criação.</p>"],
  registro:["O que é um registro", "<p>Alguns logs têm várias linhas por registro (como o stack trace do Java). O aplicativo detecta isso sozinho; se precisar, informe uma expressão que marque o <b>começo</b> de cada registro. Os padrões valem para o registro inteiro.</p>"],
  nova:["Nova coluna", "<p>Cada coluna tem o seu próprio padrão. Você pode trocar o padrão pela lista, ou escrever a expressão (Grok ou Regex) e ver o resultado na hora.</p>"],
  padroes:["Padrões possíveis", "<p>Combinamos <b>o que o valor é</b> (IP, data, palavra, formato do texto…) com <b>onde ele está</b> (começo ou fim da linha, depois de uma palavra, valor de uma chave, entre parênteses, antes de um texto…).</p><p>O número à direita é em quantas amostras o padrão encontra um valor. Quanto mais próximo do total, mais confiável.</p>"],
  tabela:["Colunas", "<p>A coluna em criação aparece em destaque, no topo. Depois vêm as suas colunas e as que já existiam. Duplo clique no nome para renomear; clique no tipo para trocar.</p><p>Os tipos seguem referências como ECS (Elastic), os padrões Grok e o Splunk CIM.</p>"],
};
document.addEventListener("click", e => { const b = e.target.closest("[data-info]"); if (!b) return; const [t, body] = INFO[b.dataset.info]; const d = $("#dlg"); d.innerHTML = `<h2>${t}</h2>${body}<div class="row"><form method="dialog"><button class="btn">Fechar</button></form></div>`; d.onclose = null; d.showModal(); });
function askText(title, value, done) { const d = $("#dlg"); d.innerHTML = `<form method="dialog"><h2>${esc(title)}</h2><input class="q" name="v" value="${esc(value)}" autocomplete="off"><div class="row"><button class="btn" value="no">Cancelar</button><button class="btn primary" value="ok">OK</button></div></form>`; d.onclose = () => { if (d.returnValue === "ok") done(d.querySelector("input").value); }; d.showModal(); d.querySelector("input").select(); }
$("#start-edit").onclick = () => askText("Cada registro começa com (expressão regular)", L().start.startsWith("(") ? "" : L().start, v => { L().start = v || "(uma linha por registro)"; toast("O arquivo seria relido com esta definição"); renderAll(); });
$("#prev").onclick = () => { S.idx[S.type] = idx() - 1; S.draft = null; renderAll(); }; $("#next").onclick = () => { S.idx[S.type] = idx() + 1; S.draft = null; renderAll(); };
$("#undo").onclick = undo; $("#theme").onclick = () => { const r = document.documentElement; r.dataset.theme = (r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark" ? "light" : "dark"; };
$("#apply").onclick = () => { const mine = S.cols[S.type]; if (!mine.length) return toast("Crie ao menos uma coluna"); const d = $("#dlg"); d.innerHTML = `<h2>Aplicar ao Caso</h2><p>${mine.map(c => `<code>norm.${esc(c.name)}</code>`).join(" ")}</p><div class="row"><form method="dialog"><button class="btn" value="no">Voltar</button><button class="btn primary" value="ok">Aplicar</button></form></div>`; d.onclose = () => { if (d.returnValue === "ok") toast("Aplicado ao Caso"); }; d.showModal(); };
let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }
for (const [s, n] of [["#undo", "undo"], ["[data-info=geral]", "info"], ["#theme", "moon"], ["#prev", "left"], ["#next", "right"], ["#start-edit", "edit"]]) document.querySelectorAll(s).forEach(b => b.innerHTML = svg(n));
$("#apply").innerHTML = svg("check") + "Aplicar";
renderAll();
</script>

name: Consolidate shared learning
on:
  push:
    branches: [learning-models]
    paths: ['models/contributions/**', 'models/diagnostic-contributions/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: learning-${{ github.ref }}
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.ref_name == 'learning-models'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: learning-models
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate the closed protocol and learning contracts
        run: cargo test --manifest-path crates/log-learning/Cargo.toml --locked
      - name: Rebuild the shared model deterministically
        run: |
          cargo run --manifest-path crates/log-learning/Cargo.toml --locked -- consolidate models/contributions models/shared-model.json
          cargo run --manifest-path crates/log-learning/Cargo.toml --locked -- check models/shared-model.json
          mkdir -p models/diagnostic-contributions
          cargo run --manifest-path crates/log-learning/Cargo.toml --locked -- diagnostic-consolidate models/diagnostic-contributions models/diagnostic-knowledge.json
          cargo run --manifest-path crates/log-learning/Cargo.toml --locked -- diagnostic-check models/diagnostic-knowledge.json
      - name: Save the validated shared revision
        run: |
          if git diff --quiet -- models/shared-model.json models/diagnostic-knowledge.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/shared-model.json models/diagnostic-knowledge.json
          git commit -m 'learning: consolidate validated aggregate contributions'
          git push origin HEAD:learning-models

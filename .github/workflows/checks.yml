name: Pull request checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and interaction regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    concurrency:
      group: checks-frontend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/preview/package-lock.json
      - run: npm ci
      - run: npm ci --prefix scripts/preview
      - run: npx --prefix scripts/preview playwright install --with-deps chromium
      - run: npm run check
      - run: npm run prepare:frontend
      - name: Focused draft interaction checks
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: npm run test:preview -- test-responsiveness.mjs test-updates.mjs test-explorer-timeline.mjs test-field-transform.mjs test-exclusion-archive.mjs test-case-references.mjs test-canonical-field-actions.mjs test-journeys.mjs test-java-trace.mjs
      - name: Full browser regression suite
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        run: npm run test:preview
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-diagnostics
          path: output/playwright/
          if-no-files-found: ignore

  # Draft development keeps fast checks active; ready-for-review/manual checks
  # retain the complete native gate. Release/build signing gates are unchanged.
  backend:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Keep an expensive native build alive while newer UI-only fixes validate.
    # GitHub retains only the latest pending run in this per-platform group.
    concurrency:
      group: checks-backend-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    env:
      CARGO_TERM_COLOR: always
      # Avoid running several independent large fixture/index builds at once.
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run prepare:frontend
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --tests -- --test-threads=1
      - name: Build Windows portable review executable
        if: runner.os == 'Windows'
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked --bin loginsight
      - name: Record portable executable identity
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = 'output/windows-portable-review'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item 'src-tauri/target/release/loginsight.exe' "$destination/LogInsight.exe"
          $digest = (Get-FileHash "$destination/LogInsight.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            kind = 'portable-review-build'
            platform = 'windows-x64'
            sourceCommit = $env:REVIEW_SOURCE_SHA
            buildCommit = (git rev-parse HEAD)
            executable = 'LogInsight.exe'
            sha256 = $digest
          } | ConvertTo-Json | Set-Content "$destination/build-identity.json" -Encoding utf8
      - name: Upload Windows portable review build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LogInsight-Windows-x64-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/windows-portable-review/
          if-no-files-found: error
          retention-days: 30

# Portable review artifact only: no installers, updater runs, signing,
# production configuration changes, repository writes or releases.

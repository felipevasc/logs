name: Build Windows and Linux

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the version in package.json after both platforms pass
        type: boolean
        required: false
        default: false
      reuse_checks_run_id:
        description: Reuse reviewed full CI run 37134532695 for unchanged product code (main only)
        type: string
        required: false
        default: ''
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks-proof:
    name: Verify prior regression evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.proof.outputs.reused }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify focused release reuse and supervisor contracts
        run: node --test scripts/tests/reuse-release-checks.test.mjs scripts/tests/core-validation-plan.test.mjs scripts/tests/supervisor-handshake.test.mjs
      - name: Prove prior full regression and unchanged product
        id: proof
        env:
          REUSE_CHECKS_RUN_ID: ${{ inputs.reuse_checks_run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/reuse-release-checks.mjs

  validate:
    name: Essential release checks (fresh or proven)
    needs: checks-proof
    runs-on: ubuntu-22.04
    # Core data and ownership checks, with bounded setup and diagnostics.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/preview/package-lock.json
      - name: Verify triggering tag
        run: node scripts/release/verify-trigger.mjs
      - if: needs.checks-proof.outputs.reused != 'true'
        run: npm ci
      - if: needs.checks-proof.outputs.reused != 'true'
        run: npm ci --prefix scripts/preview
      - if: needs.checks-proof.outputs.reused != 'true'
        run: npx --prefix scripts/preview playwright install --with-deps chromium
      - if: needs.checks-proof.outputs.reused != 'true'
        run: npm run check
      - if: needs.checks-proof.outputs.reused != 'true'
        run: npm run prepare:frontend
      - name: Core browser checks
        if: needs.checks-proof.outputs.reused != 'true'
        run: npm run test:preview
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preview-diagnostics
          path: |
            output/playwright/
            !output/playwright/**/*.webm
          if-no-files-found: ignore

  build:
    needs: checks-proof
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
            bundles: nsis,msi
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64
            bundles: deb,appimage,rpm
    env:
      CARGO_TERM_COLOR: always
      RUST_TEST_THREADS: '1'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils xvfb
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Verify triggering tag
        run: node scripts/release/verify-trigger.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-release-v1
      - run: npm ci
      - name: Verify version
        run: node scripts/release/verify-version.mjs
      - name: Verify release safeguards
        run: node scripts/release/test-release.mjs
      - name: Verify Windows process cleanup
        if: runner.os == 'Windows'
        run: node scripts/release/test-process-supervision.mjs
      - name: Test event detail tree and formatters
        if: needs.checks-proof.outputs.reused != 'true'
        run: node --test scripts/preview/test-detail-fields.cjs
      - run: npm run prepare:frontend
      - name: Backend tests
        if: runner.os != 'Windows' && needs.checks-proof.outputs.reused != 'true'
        run: npm run test:native
      - name: Windows backend tests with loader diagnostics
        if: runner.os == 'Windows' && needs.checks-proof.outputs.reused != 'true'
        id: backend_windows
        shell: pwsh
        run: ./scripts/ci/windows-native-tests.ps1
      - name: Verify Windows unit harness manifest
        if: runner.os == 'Windows' && needs.checks-proof.outputs.reused != 'true'
        shell: pwsh
        run: ./scripts/ci/verify-windows-manifest.ps1 -Target harness
      - name: Preserve Windows native failure evidence
        if: failure() && runner.os == 'Windows' && steps.backend_windows.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/windows-native-diagnostics/
          if-no-files-found: warn
          retention-days: 30
      - name: Build installers
        run: npm run build -- --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify Windows app manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/verify-windows-manifest.ps1 -Target app
      - name: Install native acceptance tooling
        if: runner.os == 'Windows'
        run: npm ci --prefix scripts/preview
      - name: Ensure WebView2 runtime
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/release/ensure-webview2.ps1 -InstallMissing
      - name: Windows desktop acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: node scripts/preview/test-native-desktop.mjs src-tauri/target/release/loginsight.exe
      - name: Preserve native acceptance evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-acceptance
          path: |
            output/native-environment.json
            output/native-desktop-*/results.json
            output/native-desktop-*/*.png
            output/native-desktop-*/*.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve Windows manifest verification
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-manifest-verification-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/windows-manifest-verification/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: LogInsight-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
      # Proves that this code, once installed, updates itself to the next version (after the upload, so the
      # test builds never mix with the installers).
      - name: Update end to end
        timeout-minutes: 30
        run: node scripts/release/update-e2e.mjs

  release:
    name: Publish Windows and Linux release
    needs: [build, validate]
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Only commits already in main are published
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: LogInsight-*
          merge-multiple: true
          path: release-downloads
      - name: Verify version and installers
        run: |
          node scripts/release/verify-version.mjs
          node scripts/release/prepare-assets.mjs release-downloads release-assets
      - name: Publish complete release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish.mjs release-assets

name: Build Windows and Linux

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the version in package.json after both platforms pass
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend and release regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - name: Verify triggering tag before dependency installation
        run: node scripts/release/verify-trigger.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/preview/package-lock.json
      - run: npm ci
      - run: npm ci --prefix scripts/preview
      - name: Install browser
        working-directory: scripts/preview
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:preview
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: output/playwright/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
            bundles: nsis,msi
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64
            bundles: deb,appimage,rpm
    env:
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Verify triggering tag before dependencies and build
        run: node scripts/release/verify-trigger.mjs
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Native acceptance dependencies
        if: runner.os == 'Windows'
        run: npm ci --prefix scripts/preview
      - name: Verify Windows desktop and WebView2 runtime
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/release/ensure-webview2.ps1 -InstallMissing
      - name: Verify Windows process cleanup
        if: runner.os == 'Windows'
        run: node scripts/release/test-process-supervision.mjs
      - name: Verify version
        run: node scripts/release/verify-version.mjs
      - name: Verify release safeguards
        run: node scripts/release/test-release.mjs
      - run: npm run prepare:frontend
      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --lib -- --test-threads=1
      - name: Windows atomic metadata regressions
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --test atomic_metadata_windows -- --test-threads=1
      - name: Build installers
        run: npm run build -- --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Native Windows acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: node scripts/preview/test-native-desktop.mjs src-tauri/target/release/loginsight.exe
      - name: Upload native acceptance evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-validation
          if-no-files-found: warn
          retention-days: 14
          path: |
            output/native-environment.json
            output/native-desktop-*/results.json
            output/native-desktop-*/*.png
            output/native-desktop-*/*.log
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: LogInsight-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  release:
    name: Publish Windows and Linux release
    needs: [validate, build]
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify triggering tag before downloads or publication
        run: node scripts/release/verify-trigger.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: LogInsight-*
          merge-multiple: true
          path: release-downloads
      - name: Verify version and installers
        run: |
          node scripts/release/verify-version.mjs
          node scripts/release/prepare-assets.mjs release-downloads release-assets
      - name: Publish complete release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish.mjs release-assets
